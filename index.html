<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- このページから外部への通信を、ブラウザの仕組みで禁止する。
     許可しているのは、このページ自身の部品(プログラムとモデル)の読み込みだけ。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="書留台帳">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>書留台帳</title>
<style>
  :root {
    --paper: #f6f4ef; --card: #ffffff; --ink: #1d2433; --sub: #5f6777; --line: #dcd8cd;
    --post: #c8102e; --post-ink: #ffffff; --ok: #1f7a4d; --warn-bg: #fff3cd; --warn-ink: #7a5600;
    --link: #0b57b0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14171d; --card: #1e232c; --ink: #eceef2; --sub: #a3abb9; --line: #333a47;
      --post: #e2334d; --ok: #5fd39a; --warn-bg: #4a3c10; --warn-ink: #ffe08a; --link: #8ab8ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
  h1::before { content: "〒"; color: var(--post); margin-right: 6px; }
  #count { color: var(--sub); font-size: 13px; font-variant-numeric: tabular-nums; }
  button, .btn {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 12px 16px; min-height: 48px; cursor: pointer; text-align: center;
  }
  button:disabled { opacity: .5; }
  .primary { display: block; width: 100%; background: var(--post); color: var(--post-ink); border-color: var(--post); font-weight: 700; font-size: 18px; padding: 16px; }
  .ghost { border: none; background: none; color: var(--link); padding: 8px 4px; min-height: 44px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=file] { display: none; }
  #status { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }
  #status[hidden] { display: none; }
  #status.error { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  #status .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
  #status .bar i { display: block; height: 100%; width: 35%; background: var(--post); border-radius: 2px; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
  @media (prefers-reduced-motion: reduce) { #status .bar i { animation: none; width: 100%; } }
  #search {
    width: 100%; margin: 20px 0 6px; font: inherit; font-size: 17px; padding: 14px 16px; min-height: 52px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  #search:focus { outline: 2px solid var(--post); outline-offset: 1px; }
  #listTitle { color: var(--sub); font-size: 13px; margin: 10px 2px 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .item.warn { border-color: #d9a400; }
  .name { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .meta { color: var(--sub); font-size: 13px; }
  .addr { font-size: 14px; margin: 4px 0 8px; overflow-wrap: anywhere; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 17px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .flag { display: inline-block; background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .actions { display: flex; align-items: center; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .track { display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; min-height: 44px; }
  .track.all { display: block; text-align: center; margin: 4px 0 14px; background: var(--post); color: var(--post-ink); }
  .empty { color: var(--sub); text-align: center; padding: 28px 8px; font-size: 15px; }
  details { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { color: var(--sub); font-size: 14px; min-height: 44px; display: flex; align-items: center; cursor: pointer; }
  details p { color: var(--sub); font-size: 13px; margin: 8px 0; }
  label.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; margin: 10px 0; }
  label.field input { width: 88px; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-align: right; }
  .danger { color: var(--post); }
</style>
</head>
<body>
<main>
  <header>
    <h1>書留台帳</h1>
    <span id="count"></span>
  </header>

  <button class="primary" id="shoot">受領証を撮る</button>
  <div class="row" style="justify-content:center">
    <button class="ghost" id="pick">保存済みの写真から選ぶ</button>
  </div>
  <input type="file" id="camera" accept="image/*" capture="environment">
  <input type="file" id="library" accept="image/*">

  <div id="status" hidden role="status" aria-live="polite"></div>
  <div id="registered"></div>

  <input type="search" id="search" placeholder="名前・住所・郵便番号・番号で探す" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="台帳を検索">
  <div id="listTitle"></div>
  <div id="list"></div>

  <details>
    <summary>書き出しと設定</summary>
    <div class="row">
      <button id="export">Excelファイルに書き出す</button>
    </div>
    <p>台帳はこのiPhoneの中にだけ保存されています。書き出したファイルは「ファイル」アプリやNumbersで開けます。</p>
    <label class="field">台帳に残す日数(0で消さない)
      <input type="number" id="retention" min="0" max="3650" inputmode="numeric">
    </label>
    <p>提出日からこの日数を過ぎた行は自動で消えます。郵便追跡ができるのは約100日間です。</p>
    <button class="ghost danger" id="wipe">台帳をすべて消す</button>
    <p id="about"></p>
  </details>
</main>
<script src="opencv.js"></script>
<script src="ort.wasm.min.js"></script>
<script src="xlsx.mini.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
